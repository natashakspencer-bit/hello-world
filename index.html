<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hello World</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root { --bg: #eef2f6; --fg: #16202b; --muted: #5b6876; --accent: #2f6fd6; --display: "Fraunces", Georgia, "Times New Roman", serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #10161d; --fg: #e8eef5; --muted: #8e9bab; --accent: #7aa7f0; color-scheme: dark; } }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); display: grid; place-items: center; padding-block: 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
main { display: grid; gap: 12px; text-align: center; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(3rem, 12vw, 7rem); line-height: 1; margin: 0; text-wrap: balance; }
h1 span { color: var(--accent); }
p { font-family: var(--mono); font-size: 0.95rem; color: var(--muted); margin: 0; }
</style>
</head>
<body>
<main>
<h1>Hello, <span>world</span>.</h1>
<p>printf("hello, world\n");</p>
</main>
</body>
</html>
